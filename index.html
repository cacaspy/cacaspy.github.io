<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My first GitHub Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Smooch Sans", sans-serif;
      max-width: 640px;
      margin: 4rem auto;
      padding: 0 1.5rem 6rem;
      line-height: 1.5;
    }
    .page-switch {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      padding: 0.75rem;
      background: #fff;
      border-top: 1px solid #ddd;
    }
    .page-switch a {
      padding: 0.45rem 1rem;
      border: 1px solid #222;
      border-radius: 999px;
      text-decoration: none;
      color: #222;
    }
    .page-switch a.current {
      background: #222;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>Hello from GitHub Pages</h1>
  <p>This page is live because the files live in a GitHub repo.</p>

  <nav class="page-switch" aria-label="Pages">
    <a class="current" href="index.html">Page 1 · Bio</a>
    <a href="profile.html">Page 2 · Profile</a>
  </nav>
</body>
</html>
