<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cacaspy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; min-height: 100%; background: #000; color: #d6ffd6; font-family: "Smooch Sans", sans-serif; }
    #matrix {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none; display: block;
    }
    .content {
      position: relative; z-index: 1;
      max-width: 640px; margin: 0 auto;
      padding: 4rem 1.5rem 7rem;
    }
    a { color: #7cffb2; }
    .page-switch {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
      display: flex; gap: 0.5rem; justify-content: center;
      padding: 0.75rem;
      background: rgba(0,0,0,0.78);
      border-top: 1px solid #00ff41;
    }
    .page-switch a {
      padding: 0.45rem 1rem;
      border: 1px solid #00ff41;
      border-radius: 999px;
      text-decoration: none;
      color: #00ff41;
    }
    .page-switch a.current { background: #00ff41; color: #000; }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>

  <main class="content"></main>

  <nav class="page-switch" aria-label="Pages">
    <a class="current" href="index.html">Page 1 · Bio</a>
    <a href="profile.html">Page 2 · Profile</a>
  </nav>

  <script>
    const c = document.getElementById("matrix");
    const ctx = c.getContext("2d");
    const letters = "01カサcacaspyアイウエオ01".split("");
    let cols, drops, size = 16;

    function resize() {
      c.width = innerWidth;
      c.height = innerHeight;
      cols = Math.floor(c.width / size);
      drops = Array(cols).fill(1);
    }
    function draw() {
      ctx.fillStyle = "rgba(0,0,0,0.08)";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = "#00ff41";
      ctx.font = size + "px monospace";
      for (let i = 0; i < drops.length; i++) {
        const ch = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(ch, i * size, drops[i] * size);
        if (drops[i] * size > c.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      requestAnimationFrame(draw);
    }
    addEventListener("resize", resize);
    resize();
    draw();
  </script>
</body>
</html>
